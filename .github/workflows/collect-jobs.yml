name: Collect geography job leads

on:
  push:
    paths:
      - "scripts/collect_jobs.py"
      - "collector-sources.json"
      - ".github/workflows/collect-jobs.yml"
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: geography-job-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover current recruitment leads
        run: python scripts/collect_jobs.py
      - name: Save refreshed lead pool
        run: |
          if git diff --quiet -- leads.json collector-status.json; then
            echo "No lead changes"
            exit 0
          fi
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add leads.json collector-status.json
          git commit -m "Auto collect geography job leads"
          git pull --rebase origin main
          git push

