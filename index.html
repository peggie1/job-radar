<body>
  <header><div class="wrap"><div class="brandline"><div class="logo"><svg width="25" height="25" viewBox="0 0 24 24" fill="none"><circle cx="10.5" cy="10.5" r="6.5" stroke="white" stroke-width="1.8"/><path d="m15.5 15.5 4.5 4.5M10.5 7v7M7 10.5h7" stroke="white" stroke-width="1.8" stroke-linecap="round"/></svg></div><div class="brandcopy"><h1>地理求职雷达</h1><div class="sub">2027届 · 人文地理专属岗位库</div><small>教师编 · 公务员 · 事业编 · 央国企</small></div></div><div class="status"><i></i><span id="updated">正在读取岗位数据…</span></div></div></header>
  <div class="summary wrap"><div class="metric"><span>岗位与候选线索</span><b id="activeCount">0</b><small>已核验＋云端自动发现</small></div><div class="metric"><span>今日新入库</span><b id="newCount">0</b><small>逐条核对官方公告</small></div><div class="metric"><span>强匹配岗位</span><b id="strongCount">0</b><small>专业明确匹配</small></div><div class="metric urgent"><span>7日内截止</span><b id="urgentCount">0</b><small>建议优先准备</small></div></div>
  <main class="wrap">
    <div class="scope-note"><span>ⓘ</span><span><b>数据口径：</b>“已核验岗位”已检查公告条件；“待核验线索”由云端采集器自动发现，数量更广，但投递前必须打开原文确认专业、届别和截止时间。两者不会混成同一可信等级。</span></div>
    <section class="panel">
      <div class="search-row"><input class="search" id="search" placeholder="可选：搜索公告关键词" /><button class="refresh" id="refresh">同步最新数据库</button></div>
      <div class="filter-title">岗位类型</div><div class="chips" id="typeChips"></div>
      <div class="filter-title">你的目标城市</div><div class="chips" id="cityChips"></div>
      <div class="quick-grid">
        <div class="field"><label for="moreCity">更多地区</label><select id="moreCity"></select></div>
        <div class="field"><label for="unit">招聘单位</label><select id="unit"></select></div>
        <div class="field"><label for="position">招聘岗位</label><select id="position"></select></div>
        <div class="field"><label for="nature">编制/用工性质</label><select id="nature"></select></div>
        <div class="field"><label for="salaryFilter">薪资阶梯</label><select id="salaryFilter"><option value="all">不限薪资（含未公开）</option><option value="5000">明确月薪 ≥ 5000元</option><option value="6000">明确月薪 ≥ 6000元</option><option value="7000">明确月薪 ≥ 7000元</option><option value="8000">明确月薪 ≥ 8000元</option><option value="10000">明确月薪 ≥ 10000元</option><option value="unknown">待遇未公开 / 待核实</option></select></div><div class="field"><label for="recruitChannel">招聘渠道</label><select id="recruitChannel"><option>全部</option><option>校园招聘</option><option>统一招考</option><option>人才引进</option><option>社会招聘</option><option>未说明</option></select></div><div class="field"><label for="verificationStatus">核验状态</label><select id="verificationStatus"><option>全部</option><option>已核验</option><option>待核验线索</option></select></div>
      </div>
      <details class="more"><summary>更多资格条件</summary><div class="advanced-grid">
        <div class="field"><label for="degree">学历要求</label><select id="degree"><option>全部</option><option>仅研究生</option><option>本科及以上</option><option>不限</option><option>未说明</option></select></div>
        <div class="field"><label for="assessment">考核方式</label><select id="assessment"><option>全部</option><option>直接/优先面试</option><option>笔试+面试</option><option>其他</option><option>未说明</option></select></div><div class="field"><label for="interviewMode">面试形式</label><select id="interviewMode"><option>全部</option><option>线上可完成</option><option>需线下面试</option><option>宣讲会现场面试</option><option>线上线下待通知</option><option>未说明</option></select></div><div class="field"><label for="travelAdvice">是否值得跨城去</label><select id="travelAdvice"><option>全部</option><option>值得专程去</option><option>拿到正式面试再去</option><option>不建议专程去</option><option>无需到场（线上）</option><option>未评估</option></select></div>
        <div class="field"><label for="consistency">本硕专业一致性</label><select id="consistency"><option>全部</option><option>要求本硕一致</option><option>明确不要求</option><option>未说明</option></select></div>
        <div class="field"><label for="match">匹配程度</label><select id="match"><option>全部</option><option>强匹配</option><option>可尝试</option><option>备选</option></select></div>
        <div class="field"><label for="deadlineWindow">截止时间</label><select id="deadlineWindow"><option value="all">全部在招</option><option value="7">7日内截止</option><option value="30">30日内截止</option></select></div>
        <div class="field"><label for="graduateYear">2027届资格</label><select id="graduateYear"><option>全部</option><option>2027届可报</option><option>应届生可报（待确认届别）</option><option>未说明</option></select></div>
        <div class="field"><label for="politics">政治面貌</label><select id="politics"><option>全部</option><option>共青团员可报</option><option>不限</option><option>未说明</option></select></div>
        <div class="field"><label for="hukou">户籍要求</label><select id="hukou"><option>全部</option><option>户籍不限</option><option>山西户籍可报</option><option>有限制</option><option>未说明</option></select></div>
      </div></details>
      <button class="reset" id="reset">清除全部筛选</button><div class="hint">下拉选项会随每日岗位库自动更新；无需手动输入单位、岗位或城市。</div>
    </section>
    <div class="section-title"><div><h2 id="listTitle">为你匹配</h2><small id="resultCount"></small></div><div class="list-tools"><select class="sort" id="sort"><option value="smart">智能推荐</option><option value="deadline">截止优先</option><option value="new">最新入库</option></select></div></div><div class="list" id="list"></div>
  </main>
  <nav><button class="active" data-view="all">◉<br>岗位</button><button data-view="saved">♡<br>收藏</button></nav>
  <script>
    const PRIORITY_CITIES=['天津','苏州','无锡','常州','杭州','湖州','嘉兴','太原','晋城','长治'];
    const SUPPLEMENT_CITIES=['南京','南通','镇江','扬州','绍兴','宁波','金华','上海','北京','济南','青岛','合肥','郑州','西安','武汉','长沙','成都'];
    const TYPES=['全部','教师编','公务员','事业编','央国企'];
    const DEFAULTS={type:'全部',city:'全部',unit:'全部',position:'全部',nature:'全部',degree:'全部',assessment:'全部',interviewMode:'全部',travelAdvice:'全部',recruitChannel:'全部',verificationStatus:'全部',consistency:'全部',match:'全部',deadlineWindow:'all',graduateYear:'全部',politics:'全部',hukou:'全部',salaryFilter:'all',q:'',view:'all',sort:'smart'};
    const state={jobs:[],...DEFAULTS,saved:new Set(JSON.parse(localStorage.getItem('savedJobs')||'[]'))};
    const $=s=>document.querySelector(s),esc=v=>String(v??'未说明').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),daysLeft=d=>d?Math.ceil((new Date(d+'T23:59:59')-new Date())/864e5):99999;
    async function refreshJobs(){const btn=$('#refresh');btn.disabled=true;btn.textContent='同步中…';try{const stamp=Date.now(),[jobRes,leadRes]=await Promise.all([fetch(`jobs.json?t=${stamp}`,{cache:'no-store'}),fetch(`leads.json?t=${stamp}`,{cache:'no-store'}).catch(()=>null)]),data=await jobRes.json(),leadData=leadRes&&leadRes.ok?await leadRes.json():{leads:[],updatedAt:'尚未采集'};if(!jobRes.ok||!Array.isArray(data.jobs))throw new Error('数据格式错误');const verified=data.jobs.map(j=>normalize({verificationStatus:'已核验',sourceLevel:'官方公告已核验',...j})),leads=Array.isArray(leadData.leads)?leadData.leads.map(j=>normalize(j)):[];state.jobs=[...verified,...leads];$('#updated').textContent=`云端每日采集 · 已核验 ${verified.length} 条 · 线索 ${leads.length} 条 · ${leadData.updatedAt||data.updatedAt}`;buildFilters();render();btn.textContent='已同步'}catch(e){$('#updated').textContent='岗位数据读取失败';$('#list').innerHTML='<div class="empty">数据暂时无法读取，请稍后刷新</div>';btn.textContent='重试'}finally{btn.disabled=false;setTimeout(()=>btn.textContent='同步最新数据库',1500)}}
    async function boot(){await refreshJobs()}
    function normalize(j){return{verificationStatus:'已核验',sourceLevel:'官方公告已核验',degree:'未说明',assessment:'未说明',interviewMode:'未说明',travelAdvice:'未评估',travelReason:'尚未结合面试形式与跨城成本评估',recruitChannel:'未说明',consistency:'未说明',graduateYear:'未说明',politics:'未说明',hukou:'未说明',salaryMin:null,headcount:'未说明',major:'未说明',applyStart:'未说明',applyEnd:j.deadline||'未说明',certificates:'未说明',important:[],summary:'公告重点待整理',sourceTitle:'官方招聘公告',...j}}
    function unique(key){return[...new Set(state.jobs.map(j=>j[key]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'zh-CN'))}
    function options(sel,items,allLabel,selected){$(sel).innerHTML=`<option value="全部">${allLabel}</option>`+items.map(x=>`<option ${x===selected?'selected':''}>${esc(x)}</option>`).join('')}
    function buildFilters(){chips('#typeChips',TYPES,'type');chips('#cityChips',['全部',...PRIORITY_CITIES],'city');const other=['全国其他地区',...new Set([...SUPPLEMENT_CITIES,...unique('city').filter(x=>!PRIORITY_CITIES.includes(x))])];options('#moreCity',other,'更多地区',state.city);options('#unit',unique('org'),'全部单位',state.unit);options('#position',unique('title'),'全部岗位',state.position);options('#nature',unique('nature'),'全部性质',state.nature);bindChips()}
    function chips(sel,items,key){$(sel).innerHTML=items.map(x=>`<button class="chip ${state[key]===x?'on':''}" data-key="${key}" data-value="${esc(x)}">${esc(x)}</button>`).join('')}
    function bindChips(){document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{state[b.dataset.key]=b.dataset.value;if(b.dataset.key==='city')$('#moreCity').value='全部';buildFilters();render()})}
    function matchJob(j){const d=daysLeft(j.deadline),cityOK=state.city==='全部'||(state.city==='全国其他地区'?!PRIORITY_CITIES.includes(j.city):j.city===state.city);return d>=0&&(state.type==='全部'||j.type===state.type)&&cityOK&&(state.unit==='全部'||j.org===state.unit)&&(state.position==='全部'||j.title===state.position)&&(state.nature==='全部'||j.nature===state.nature)&&(state.degree==='全部'||j.degree===state.degree)&&(state.assessment==='全部'||j.assessment===state.assessment)&&(state.interviewMode==='全部'||j.interviewMode===state.interviewMode)&&(state.travelAdvice==='全部'||j.travelAdvice===state.travelAdvice)&&(state.recruitChannel==='全部'||j.recruitChannel===state.recruitChannel)&&(state.verificationStatus==='全部'||j.verificationStatus===state.verificationStatus)&&(state.consistency==='全部'||j.consistency===state.consistency)&&(state.match==='全部'||j.match===state.match)&&(state.deadlineWindow==='all'||d<=Number(state.deadlineWindow))&&(state.graduateYear==='全部'||j.graduateYear===state.graduateYear)&&(state.politics==='全部'||j.politics===state.politics)&&(state.hukou==='全部'||j.hukou===state.hukou)&&(state.salaryFilter==='all'||(state.salaryFilter==='unknown'&&j.salaryMin==null)||(!['all','unknown'].includes(state.salaryFilter)&&j.salaryMin!=null&&Number(j.salaryMin)>=Number(state.salaryFilter)))&&(!state.q||JSON.stringify(j).toLowerCase().includes(state.q))&&(state.view==='all'||state.saved.has(j.id))}
    function render(){const sorter=(a,b)=>state.sort==='deadline'?daysLeft(a.deadline)-daysLeft(b.deadline):state.sort==='new'?String(b.addedAt||'').localeCompare(String(a.addedAt||'')):(b.assessment==='直接/优先面试')-(a.assessment==='直接/优先面试')||rank(a.match)-rank(b.match)||daysLeft(a.deadline)-daysLeft(b.deadline),jobs=state.jobs.filter(matchJob).sort(sorter),active=state.jobs.filter(j=>daysLeft(j.deadline)>=0);const today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Shanghai'});$('#newCount').textContent=state.jobs.filter(j=>j.addedAt===today).length;$('#activeCount').textContent=active.length;$('#strongCount').textContent=active.filter(j=>j.match==='强匹配').length;$('#urgentCount').textContent=active.filter(j=>{const d=daysLeft(j.deadline);return d>=0&&d<=7}).length;const verifiedCount=active.filter(j=>j.verificationStatus==='已核验').length,leadCount=active.filter(j=>j.verificationStatus==='待核验线索').length;$('#resultCount').textContent=`显示 ${jobs.length} 条 · 已核验 ${verifiedCount} 条 · 待核验线索 ${leadCount} 条`;$('#listTitle').textContent=state.view==='saved'?'我的收藏':'为你匹配';$('#list').innerHTML=jobs.length?jobs.map(card).join(''):'<div class="empty">暂无符合当前条件的岗位<br><small>可清除部分筛选后再查看</small></div>';document.querySelectorAll('.save').forEach(b=>b.onclick=()=>toggleSave(b.dataset.id))}
    function rank(m){return{'强匹配':0,'可尝试':1,'备选':2}[m]??3}
    function card(j){const hasDeadline=Boolean(j.deadline),d=daysLeft(j.deadline),urgent=hasDeadline&&d<=7,deadlineText=!hasDeadline?(j.applyEnd||'截止时间未说明'):(d===0?'今日截止':`${d}天后截止`),important=Array.isArray(j.important)?j.important.filter(Boolean):[j.important].filter(Boolean);return `<article class="job"><div class="top"><span class="badge ${urgent?'hot':''}">${esc(j.match)}</span><div><h3>${esc(j.title)}</h3><div class="org">${esc(j.org)} · ${esc(j.city)}</div></div></div><div class="meta"><span>${esc(j.type)}</span><span>${esc(j.nature)}</span><span>${esc(j.salary||'待遇未公开')}</span><span>学历：${esc(j.degree)}</span><span>考核：${esc(j.assessment)}</span><span>渠道：${esc(j.recruitChannel)}</span><span>面试：${esc(j.interviewMode)}</span><span>本硕：${esc(j.consistency)}</span></div><div class="verification ${j.verificationStatus==='待核验线索'?'pending':''}"><b>${esc(j.verificationStatus)}</b>${esc(j.sourceLevel)}</div><div class="travel-advice ${j.travelAdvice==='不建议专程去'?'no':j.travelAdvice==='无需到场（线上）'?'online':''}"><b>跨城建议：${esc(j.travelAdvice)}</b>${esc(j.travelReason)}</div>${important.length?`<div class="important"><b>重要提醒：</b>${important.map(esc).join('；')}</div>`:''}<details class="details"><summary>查看岗位详情与公告重点</summary><div class="detail-grid"><div class="detail"><b>招聘人数</b><span>${esc(j.headcount)}</span></div><div class="detail"><b>专业要求</b><span>${esc(j.major)}</span></div><div class="detail"><b>应届届别</b><span>${esc(j.graduateYear)}</span></div><div class="detail"><b>报名时间</b><span>${esc(j.applyStart)} 至 ${esc(j.applyEnd)}</span></div><div class="detail"><b>政治面貌</b><span>${esc(j.politics)}</span></div><div class="detail"><b>户籍要求</b><span>${esc(j.hukou)}</span></div><div class="detail"><b>证书及其他资格</b><span>${esc(j.certificates)}</span></div><div class="detail"><b>公告名称</b><span>${esc(j.sourceTitle)}</span></div></div><div class="notice"><b>公告重点</b>${esc(j.summary)}</div></details><div class="foot"><span class="${urgent?'deadline':''}">${esc(deadlineText)}</span><div class="actions"><button class="btn save" data-id="${esc(j.id)}">${state.saved.has(j.id)?'已收藏':'收藏'}</button><a class="btn primary" href="${esc(j.url)}" target="_blank" rel="noopener">查看完整公告</a></div></div></article>`}
    function toggleSave(id){state.saved.has(id)?state.saved.delete(id):state.saved.add(id);localStorage.setItem('savedJobs',JSON.stringify([...state.saved]));render()}
    const selectKeys=['unit','position','nature','degree','assessment','interviewMode','travelAdvice','recruitChannel','verificationStatus','consistency','match','deadlineWindow','graduateYear','politics','hukou','salaryFilter'];selectKeys.forEach(k=>$(`#${k}`).onchange=e=>{state[k]=e.target.value;render()});$('#moreCity').onchange=e=>{state.city=e.target.value;buildFilters();render()};$('#search').oninput=e=>{state.q=e.target.value.trim().toLowerCase();render()};$('#refresh').onclick=refreshJobs;$('#sort').onchange=e=>{state.sort=e.target.value;render()};$('#reset').onclick=()=>{Object.assign(state,DEFAULTS);$('#search').value='';$('#sort').value='smart';selectKeys.forEach(k=>$(`#${k}`).value=DEFAULTS[k]);buildFilters();render()};document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshJobs()});document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));render()});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');boot();
  </script>
