<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课堂与手写 · 山海课间</title><link rel="stylesheet" href="studio.css"></head><body>
<header><a href="./">← 返回课程库</a><h1 id="title">教材与手写工作台</h1><span id="status" role="status">正在准备…</span></header>
<div class="tools"><button id="browse">浏览 / 滚动</button><button id="pen" aria-pressed="true">笔</button><button id="highlight">荧光笔</button><button id="eraser">整笔橡皮</button><label><input id="finger" type="checkbox">允许手指书写</label><label>颜色 <input id="color" type="color" value="#c14336"></label><label>粗细 <input id="width" type="range" min="2" max="16" value="4"></label><button id="undo">撤销</button><button id="redo">重做</button><button id="export">导出笔迹备份</button><button id="import">导入笔迹</button><input id="ink-file" type="file" accept="application/json" hidden><button id="image">保存标注图片</button></div>
<div class="pager"><button id="prev">上一页</button><span id="page-label"></span><button id="next">下一页</button><button id="board">板书</button><button id="slides">学生课件</button><button id="show-notes">隐藏教师提示</button><button id="pdf-open">导入教材PDF</button><input id="pdf-file" type="file" accept="application/pdf" hidden><button id="saved-pdf">打开本册教材</button><label>跳页 <input id="jump-page" type="number" min="1" value="1" style="width:65px"></label><button id="jump">前往</button></div>
<p class="hint">书写模式默认只接收笔输入，避免手掌留下笔迹；需要手指滚动时切换“浏览”。笔迹保存在当前浏览器，请定期导出备份。导入的PDF只留在本设备。</p>
<main><div id="stage"><canvas id="paper" width="1280" height="900"></canvas><canvas id="ink" width="1280" height="900" aria-label="手写标注画布"></canvas></div><section id="notes"><h2>教师讲解与操作</h2><div id="script"></div></section></main>
<script type="module" src="studio.js"></script></body></html>
