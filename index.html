<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#173f36" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>地理求职雷达</title>
  <style>
    :root{--ink:#15322c;--muted:#6d7d78;--paper:#f5f3ec;--card:#fff;--green:#173f36;--mint:#dfece4;--orange:#e97b3f;--red:#a94315;--line:#dde3df}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,select,input{font:inherit}
    header{background:linear-gradient(135deg,#173f36,#286b59);color:#fff;padding:34px 18px 68px}.wrap{max-width:980px;margin:auto}h1{font-size:28px;margin:0 0 8px}.sub{opacity:.84;font-size:14px}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:-42px 14px 18px}.metric,.panel,.job{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 7px 24px #15322c0d}.metric{padding:16px;text-align:center}.metric b{display:block;font-size:23px}.metric span{font-size:12px;color:var(--muted)}
    main{padding:0 14px 52px}.panel{padding:14px;margin-bottom:14px}.search{width:100%;border:0;background:#f1f4f2;padding:13px 14px;border-radius:12px;font-size:15px;outline:none}.hint{font-size:11px;color:var(--muted);margin:8px 2px 0}
    .filter-title{font-size:12px;color:var(--muted);margin:13px 2px 0}.chips{display:flex;gap:8px;overflow:auto;padding-top:8px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:999px;color:var(--ink)}.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
    .quick-grid,.advanced-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.field label{display:block;color:var(--muted);font-size:11px;margin:0 0 5px 3px}.field select{width:100%;min-width:0;border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 8px;border-radius:10px;font-size:13px}.more{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.more summary{cursor:pointer;font-size:13px;font-weight:650;list-style:none}.more summary::after{content:'＋';float:right}.more[open] summary::after{content:'－'}.reset{margin-top:11px;width:100%;border:0;background:#eef2ef;color:var(--ink);border-radius:10px;padding:9px}
    .section-title{display:flex;justify-content:space-between;align-items:center;margin:20px 3px 10px}.section-title h2{font-size:17px;margin:0}.section-title small{color:var(--muted)}.list{display:grid;gap:12px}.job{padding:16px}.top{display:flex;gap:12px;align-items:flex-start}.badge{font-size:12px;padding:5px 8px;border-radius:8px;background:var(--mint);color:var(--green);white-space:nowrap}.badge.hot{background:#fff0e7;color:var(--red)}.job h3{margin:0 0 5px;font-size:17px}.org{color:var(--muted);font-size:13px}
    .meta{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0}.meta span{background:#f4f6f4;padding:5px 8px;border-radius:7px;font-size:12px}.important{background:#fff7ed;border-left:3px solid var(--orange);padding:9px 10px;border-radius:7px;font-size:12px;line-height:1.6;margin:10px 0}.details{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}.details summary{cursor:pointer;font-size:13px;font-weight:650}.detail-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:11px}.detail{background:#f7f8f7;padding:9px;border-radius:9px}.detail b{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}.detail span,.notice{font-size:13px;line-height:1.55;white-space:pre-wrap}.notice{margin-top:9px;padding:10px;background:#eef5f1;border-radius:9px}.notice b{display:block;margin-bottom:5px}
    .foot{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;font-size:13px}.deadline{color:var(--orange);font-weight:650}.actions{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:8px 11px;background:#eef2ef;color:var(--ink);text-decoration:none;font-size:13px}.btn.primary{background:var(--green);color:#fff}.empty{text-align:center;color:var(--muted);padding:35px}
    nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 0 calc(9px + env(safe-area-inset-bottom));z-index:5}nav button{border:0;background:none;color:var(--muted);font-size:12px}nav button.active{color:var(--green);font-weight:700}
    @media(min-width:700px){header{padding-top:50px}.summary{max-width:952px;margin:-42px auto 22px}.quick-grid{grid-template-columns:repeat(4,1fr)}.advanced-grid{grid-template-columns:repeat(4,1fr)}.list{grid-template-columns:1fr 1fr}.detail-grid{grid-template-columns:1fr 1fr}main{padding-bottom:45px}nav{display:none}}
  </style>
</head>
<body>
  <header><div class="wrap"><h1>地理求职雷达</h1><div class="sub" id="updated">正在读取岗位数据…</div></div></header>
  <div class="summary wrap"><div class="metric"><b id="newCount">0</b><span>今日新增</span></div><div class="metric"><b id="activeCount">0</b><span>正在报名</span></div><div class="metric"><b id="urgentCount">0</b><span>7日内截止</span></div></div>
  <main class="wrap">
    <section class="panel">
      <input class="search" id="search" placeholder="可选：搜索公告全文关键词" />
      <div class="filter-title">岗位类型</div><div class="chips" id="typeChips"></div>
      <div class="filter-title">你的目标城市</div><div class="chips" id="cityChips"></div>
      <div class="quick-grid">
        <div class="field"><label for="moreCity">更多地区</label><select id="moreCity"></select></div>
        <div class="field"><label for="unit">招聘单位</label><select id="unit"></select></div>
        <div class="field"><label for="position">招聘岗位</label><select id="position"></select></div>
        <div class="field"><label for="nature">编制/用工性质</label><select id="nature"></select></div>
      </div>
      <details class="more"><summary>更多筛选条件</summary><div class="advanced-grid">
        <div class="field"><label for="degree">学历要求</label><select id="degree"><option>全部</option><option>仅研究生</option><option>本科及以上</option><option>不限</option><option>未说明</option></select></div>
        <div class="field"><label for="assessment">考核方式</label><select id="assessment"><option>全部</option><option>直接/优先面试</option><option>笔试+面试</option><option>其他</option><option>未说明</option></select></div>
        <div class="field"><label for="consistency">本硕专业一致性</label><select id="consistency"><option>全部</option><option>要求本硕一致</option><option>明确不要求</option><option>未说明</option></select></div>
        <div class="field"><label for="match">匹配程度</label><select id="match"><option>全部</option><option>强匹配</option><option>可尝试</option><option>备选</option></select></div>
        <div class="field"><label for="deadlineWindow">截止时间</label><select id="deadlineWindow"><option value="all">全部在招</option><option value="7">7日内截止</option><option value="30">30日内截止</option></select></div>
        <div class="field"><label for="graduateYear">2027届资格</label><select id="graduateYear"><option>全部</option><option>2027届可报</option><option>应届生可报（待确认届别）</option><option>未说明</option></select></div>
        <div class="field"><label for="politics">政治面貌</label><select id="politics"><option>全部</option><option>共青团员可报</option><option>不限</option><option>未说明</option></select></div>
        <div class="field"><label for="hukou">户籍要求</label><select id="hukou"><option>全部</option><option>户籍不限</option><option>山西户籍可报</option><option>有限制</option><option>未说明</option></select></div>
        <div class="field"><label for="salaryFilter">薪资待遇</label><select id="salaryFilter"><option value="all">全部</option><option value="7000">明确7000元以上</option><option value="unknown">未公开/待核实</option></select></div>
      </div></details>
      <button class="reset" id="reset">清除全部筛选</button><div class="hint">下拉选项会随每日岗位库自动更新；无需手动输入单位、岗位或城市。</div>
    </section>
    <div class="section-title"><h2 id="listTitle">为你匹配</h2><small id="resultCount"></small></div><div class="list" id="list"></div>
  </main>
  <nav><button class="active" data-view="all">◉<br>岗位</button><button data-view="saved">♡<br>收藏</button></nav>
  <script>
    const PRIORITY_CITIES=['天津','苏州','无锡','常州','杭州','湖州','嘉兴','太原','晋城','长治'];
    const SUPPLEMENT_CITIES=['南京','南通','镇江','扬州','绍兴','宁波','金华','上海','北京','济南','青岛','合肥','郑州','西安','武汉','长沙','成都'];
    const TYPES=['全部','教师编','公务员','事业编','央国企'];
    const DEFAULTS={type:'全部',city:'全部',unit:'全部',position:'全部',nature:'全部',degree:'全部',assessment:'全部',consistency:'全部',match:'全部',deadlineWindow:'all',graduateYear:'全部',politics:'全部',hukou:'全部',salaryFilter:'all',q:'',view:'all'};
    const state={jobs:[],...DEFAULTS,saved:new Set(JSON.parse(localStorage.getItem('savedJobs')||'[]'))};
    const $=s=>document.querySelector(s),esc=v=>String(v??'未说明').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),daysLeft=d=>d?Math.ceil((new Date(d+'T23:59:59')-new Date())/864e5):99999;
    async function boot(){try{const r=await fetch('jobs.json',{cache:'no-store'}),data=await r.json();state.jobs=(data.jobs||[]).map(normalize);$('#updated').textContent=`每日 08:00 更新 · 本次核验 ${data.updatedAt}`;buildFilters();render()}catch(e){$('#updated').textContent='岗位数据读取失败';$('#list').innerHTML='<div class="empty">数据暂时无法读取，请稍后刷新</div>'}}
    function normalize(j){return{degree:'未说明',assessment:'未说明',consistency:'未说明',graduateYear:'未说明',politics:'未说明',hukou:'未说明',salaryMin:null,headcount:'未说明',major:'未说明',applyStart:'未说明',applyEnd:j.deadline||'未说明',certificates:'未说明',important:[],summary:'公告重点待整理',sourceTitle:'官方招聘公告',...j}}
    function unique(key){return[...new Set(state.jobs.map(j=>j[key]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'zh-CN'))}
    function options(sel,items,allLabel,selected){$(sel).innerHTML=`<option value="全部">${allLabel}</option>`+items.map(x=>`<option ${x===selected?'selected':''}>${esc(x)}</option>`).join('')}
    function buildFilters(){chips('#typeChips',TYPES,'type');chips('#cityChips',['全部',...PRIORITY_CITIES],'city');const other=['全国其他地区',...new Set([...SUPPLEMENT_CITIES,...unique('city').filter(x=>!PRIORITY_CITIES.includes(x))])];options('#moreCity',other,'更多地区',state.city);options('#unit',unique('org'),'全部单位',state.unit);options('#position',unique('title'),'全部岗位',state.position);options('#nature',unique('nature'),'全部性质',state.nature);bindChips()}
    function chips(sel,items,key){$(sel).innerHTML=items.map(x=>`<button class="chip ${state[key]===x?'on':''}" data-key="${key}" data-value="${esc(x)}">${esc(x)}</button>`).join('')}
    function bindChips(){document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{state[b.dataset.key]=b.dataset.value;if(b.dataset.key==='city')$('#moreCity').value='全部';buildFilters();render()})}
    function matchJob(j){const d=daysLeft(j.deadline),cityOK=state.city==='全部'||(state.city==='全国其他地区'?!PRIORITY_CITIES.includes(j.city):j.city===state.city);return d>=0&&(state.type==='全部'||j.type===state.type)&&cityOK&&(state.unit==='全部'||j.org===state.unit)&&(state.position==='全部'||j.title===state.position)&&(state.nature==='全部'||j.nature===state.nature)&&(state.degree==='全部'||j.degree===state.degree)&&(state.assessment==='全部'||j.assessment===state.assessment)&&(state.consistency==='全部'||j.consistency===state.consistency)&&(state.match==='全部'||j.match===state.match)&&(state.deadlineWindow==='all'||d<=Number(state.deadlineWindow))&&(state.graduateYear==='全部'||j.graduateYear===state.graduateYear)&&(state.politics==='全部'||j.politics===state.politics)&&(state.hukou==='全部'||j.hukou===state.hukou)&&(state.salaryFilter==='all'||(state.salaryFilter==='7000'&&Number(j.salaryMin)>=7000)||(state.salaryFilter==='unknown'&&!j.salaryMin))&&(!state.q||JSON.stringify(j).toLowerCase().includes(state.q))&&(state.view==='all'||state.saved.has(j.id))}
    function render(){const jobs=state.jobs.filter(matchJob).sort((a,b)=>(b.assessment==='直接/优先面试')-(a.assessment==='直接/优先面试')||rank(a.match)-rank(b.match)||daysLeft(a.deadline)-daysLeft(b.deadline));const today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Shanghai'});$('#newCount').textContent=state.jobs.filter(j=>j.addedAt===today).length;$('#activeCount').textContent=state.jobs.filter(j=>daysLeft(j.deadline)>=0).length;$('#urgentCount').textContent=state.jobs.filter(j=>{const d=daysLeft(j.deadline);return d>=0&&d<=7}).length;$('#resultCount').textContent=`${jobs.length} 个岗位`;$('#listTitle').textContent=state.view==='saved'?'我的收藏':'为你匹配';$('#list').innerHTML=jobs.length?jobs.map(card).join(''):'<div class="empty">暂无符合当前条件的岗位<br><small>可清除部分筛选后再查看</small></div>';document.querySelectorAll('.save').forEach(b=>b.onclick=()=>toggleSave(b.dataset.id))}
    function rank(m){return{'强匹配':0,'可尝试':1,'备选':2}[m]??3}
    function card(j){const d=daysLeft(j.deadline),urgent=d<=7,important=Array.isArray(j.important)?j.important.filter(Boolean):[j.important].filter(Boolean);return `<article class="job"><div class="top"><span class="badge ${urgent?'hot':''}">${esc(j.match)}</span><div><h3>${esc(j.title)}</h3><div class="org">${esc(j.org)} · ${esc(j.city)}</div></div></div><div class="meta"><span>${esc(j.type)}</span><span>${esc(j.nature)}</span><span>${esc(j.salary||'待遇未公开')}</span><span>学历：${esc(j.degree)}</span><span>考核：${esc(j.assessment)}</span><span>本硕：${esc(j.consistency)}</span></div>${important.length?`<div class="important"><b>重要提醒：</b>${important.map(esc).join('；')}</div>`:''}<details class="details"><summary>查看岗位详情与公告重点</summary><div class="detail-grid"><div class="detail"><b>招聘人数</b><span>${esc(j.headcount)}</span></div><div class="detail"><b>专业要求</b><span>${esc(j.major)}</span></div><div class="detail"><b>应届届别</b><span>${esc(j.graduateYear)}</span></div><div class="detail"><b>报名时间</b><span>${esc(j.applyStart)} 至 ${esc(j.applyEnd)}</span></div><div class="detail"><b>政治面貌</b><span>${esc(j.politics)}</span></div><div class="detail"><b>户籍要求</b><span>${esc(j.hukou)}</span></div><div class="detail"><b>证书及其他资格</b><span>${esc(j.certificates)}</span></div><div class="detail"><b>公告名称</b><span>${esc(j.sourceTitle)}</span></div></div><div class="notice"><b>公告重点</b>${esc(j.summary)}</div></details><div class="foot"><span class="${urgent?'deadline':''}">${d===0?'今日截止':`${d}天后截止`}</span><div class="actions"><button class="btn save" data-id="${esc(j.id)}">${state.saved.has(j.id)?'已收藏':'收藏'}</button><a class="btn primary" href="${esc(j.url)}" target="_blank" rel="noopener">查看完整公告</a></div></div></article>`}
    function toggleSave(id){state.saved.has(id)?state.saved.delete(id):state.saved.add(id);localStorage.setItem('savedJobs',JSON.stringify([...state.saved]));render()}
    const selectKeys=['unit','position','nature','degree','assessment','consistency','match','deadlineWindow','graduateYear','politics','hukou','salaryFilter'];selectKeys.forEach(k=>$(`#${k}`).onchange=e=>{state[k]=e.target.value;render()});$('#moreCity').onchange=e=>{state.city=e.target.value;buildFilters();render()};$('#search').oninput=e=>{state.q=e.target.value.trim().toLowerCase();render()};$('#reset').onclick=()=>{Object.assign(state,DEFAULTS);$('#search').value='';selectKeys.forEach(k=>$(`#${k}`).value=DEFAULTS[k]);buildFilters();render()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));render()});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');boot();
  </script>
</body>
</html>
