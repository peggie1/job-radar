<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#173f36" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>地理求职雷达</title>
  <style>
    :root{--ink:#15322c;--muted:#6d7d78;--paper:#f5f3ec;--card:#fff;--green:#173f36;--mint:#dfece4;--orange:#e97b3f;--line:#dde3df}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    header{background:linear-gradient(135deg,#173f36,#286b59);color:#fff;padding:34px 18px 68px} .wrap{max-width:920px;margin:auto}
    h1{font-size:28px;margin:0 0 8px} .sub{opacity:.82;font-size:14px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:-42px 14px 18px}
    .metric,.panel,.job{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 7px 24px #15322c0d}.metric{padding:16px;text-align:center}.metric b{display:block;font-size:23px}.metric span{font-size:12px;color:var(--muted)}
    main{padding:0 14px 40px}.panel{padding:13px;margin-bottom:14px}.search{width:100%;border:0;background:#f1f4f2;padding:13px 14px;border-radius:12px;font-size:15px;outline:none}
    .chips{display:flex;gap:8px;overflow:auto;padding-top:11px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:999px;color:var(--ink)}.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
    .section-title{display:flex;justify-content:space-between;align-items:center;margin:20px 3px 10px}.section-title h2{font-size:17px;margin:0}.section-title small{color:var(--muted)}
    .list{display:grid;gap:12px}.job{padding:16px}.top{display:flex;gap:12px;align-items:flex-start}.badge{font-size:12px;padding:5px 8px;border-radius:8px;background:var(--mint);color:var(--green);white-space:nowrap}.badge.hot{background:#fff0e7;color:#a94315}
    .job h3{margin:0 0 5px;font-size:17px}.org{color:var(--muted);font-size:13px}.meta{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}.meta span{background:#f4f6f4;padding:5px 8px;border-radius:7px;font-size:12px}.foot{border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between;align-items:center;font-size:13px}.deadline{color:var(--orange);font-weight:650}.actions{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:8px 11px;background:#eef2ef;color:var(--ink);text-decoration:none;font-size:13px}.btn.primary{background:var(--green);color:white}.empty{text-align:center;color:var(--muted);padding:35px}
    nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 0 calc(9px + env(safe-area-inset-bottom));z-index:5}nav button{border:0;background:none;color:var(--muted);font-size:12px}nav button.active{color:var(--green);font-weight:700}
    @media(min-width:700px){header{padding-top:50px}.summary{max-width:892px;margin:-42px auto 22px}.list{grid-template-columns:1fr 1fr}main{padding-bottom:45px}nav{display:none}}
  </style>
</head>
<body>
  <header><div class="wrap"><h1>地理求职雷达</h1><div class="sub" id="updated">正在读取岗位数据…</div></div></header>
  <div class="summary wrap"><div class="metric"><b id="newCount">0</b><span>今日新增</span></div><div class="metric"><b id="activeCount">0</b><span>正在报名</span></div><div class="metric"><b id="urgentCount">0</b><span>7日内截止</span></div></div>
  <main class="wrap">
    <div class="panel"><input class="search" id="search" placeholder="搜索单位、岗位或城市" /><div class="chips" id="typeChips"></div><div class="chips" id="cityChips"></div></div>
    <div class="section-title"><h2 id="listTitle">为你匹配</h2><small id="resultCount"></small></div><div class="list" id="list"></div>
  </main>
  <nav><button class="active" data-view="all">◉<br>岗位</button><button data-view="saved">♡<br>收藏</button></nav>
  <script>
    const state={jobs:[],type:'全部',city:'全部',q:'',view:'all',saved:new Set(JSON.parse(localStorage.getItem('savedJobs')||'[]'))};
    const $=s=>document.querySelector(s), daysLeft=d=>Math.ceil((new Date(d+'T23:59:59')-new Date())/864e5);
    async function boot(){try{const r=await fetch('jobs.json',{cache:'no-store'});const data=await r.json();state.jobs=data.jobs||[];$('#updated').textContent=`每日 08:00 更新 · 本次核验 ${data.updatedAt}`;buildFilters();render()}catch(e){$('#updated').textContent='岗位数据读取失败';$('#list').innerHTML='<div class="empty">请通过网页服务打开此应用</div>'}}
    function buildFilters(){const types=['全部',...new Set(state.jobs.map(x=>x.type))],cities=['全部',...new Set(state.jobs.map(x=>x.city))];chips('#typeChips',types,'type');chips('#cityChips',cities,'city')}
    function chips(sel,items,key){$(sel).innerHTML=items.map(x=>`<button class="chip ${state[key]===x?'on':''}" data-key="${key}" data-value="${x}">${x}</button>`).join('')}
    function render(){let jobs=state.jobs.filter(j=>(state.type==='全部'||j.type===state.type)&&(state.city==='全部'||j.city===state.city)&&(`${j.title}${j.org}${j.city}`.toLowerCase().includes(state.q))&&(state.view==='all'||state.saved.has(j.id)));const today=new Date().toISOString().slice(0,10);$('#newCount').textContent=state.jobs.filter(j=>j.addedAt===today).length;$('#activeCount').textContent=state.jobs.filter(j=>daysLeft(j.deadline)>=0).length;$('#urgentCount').textContent=state.jobs.filter(j=>daysLeft(j.deadline)>=0&&daysLeft(j.deadline)<=7).length;$('#resultCount').textContent=`${jobs.length} 个岗位`;$('#listTitle').textContent=state.view==='saved'?'我的收藏':'为你匹配';$('#list').innerHTML=jobs.length?jobs.map(card).join(''):'<div class="empty">暂无符合筛选条件的岗位</div>';document.querySelectorAll('.save').forEach(b=>b.onclick=()=>toggleSave(b.dataset.id));document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{state[b.dataset.key]=b.dataset.value;buildFilters();render()})}
    function card(j){const d=daysLeft(j.deadline),urgent=d>=0&&d<=7;return `<article class="job"><div class="top"><span class="badge ${urgent?'hot':''}">${j.match}</span><div><h3>${j.title}</h3><div class="org">${j.org}</div></div></div><div class="meta"><span>${j.city}</span><span>${j.type}</span><span>${j.nature}</span><span>${j.salary||'待遇未公开'}</span></div><div class="foot"><span class="${urgent?'deadline':''}">${d<0?'已截止':d===0?'今日截止':`${d}天后截止`}</span><div class="actions"><button class="btn save" data-id="${j.id}">${state.saved.has(j.id)?'已收藏':'收藏'}</button><a class="btn primary" href="${j.url}" target="_blank" rel="noopener">官方公告</a></div></div></article>`}
    function toggleSave(id){state.saved.has(id)?state.saved.delete(id):state.saved.add(id);localStorage.setItem('savedJobs',JSON.stringify([...state.saved]));render()}
    $('#search').oninput=e=>{state.q=e.target.value.trim().toLowerCase();render()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));render()});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');boot();
  </script>
</body>
</html>
